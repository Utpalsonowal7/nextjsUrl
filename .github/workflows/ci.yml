name: Frontend CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:4010/api/v1
      API_BASE_URL: http://127.0.0.1:4010/api/v1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
